<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mushroom Identifier AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            flex: 1;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #219150;
        }
        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        .btn-camera {
            background-color: #2980b9;
        }
        .btn-camera:hover {
            background-color: #1f618d;
        }
        .btn-capture {
            background-color: #e67e22;
        }
        .btn-capture:hover {
            background-color: #d35400;
        }
        .btn-save {
            background-color: #8e44ad;
            margin-top: 15px;
        }
        .btn-save:hover {
            background-color: #71368a;
        }
        .btn-delete {
            background-color: #e74c3c;
            padding: 6px 12px;
            font-size: 12px;
            margin-top: 8px;
            flex: none;
            width: auto;
        }
        .btn-delete:hover {
            background-color: #c0392b;
        }
        #webcam {
            width: 100%;
            border-radius: 8px;
            display: none;
            margin-top: 10px;
            background-color: #000;
        }
        #preview {
            max-width: 100%;
            margin-top: 15px;
            border-radius: 8px;
            display: none;
        }
        #result {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .safe {
            background-color: #e8f8f5;
            border: 1px solid #2ecc71;
            color: #27ae60;
        }
        .caution {
            background-color: #fef9e7;
            border: 1px solid #f1c40f;
            color: #d35400;
        }
        .toxic {
            background-color: #fadbd8;
            border: 1px solid #e74c3c;
            color: #c0392b;
        }
        .result-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .result-item {
            margin-bottom: 8px;
            line-height: 1.5;
        }
        .disclaimer {
            margin-top: 15px;
            font-size: 12px;
            color: #7f8c8d;
            font-style: italic;
        }
        .library-section {
            margin-top: 35px;
            border-top: 2px dashed #ddd;
            padding-top: 20px;
        }
        .library-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 15px;
        }
        .library-card {
            display: flex;
            gap: 15px;
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px;
            align-items: center;
        }
        .library-card img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 6px;
        }
        .library-card-info {
            flex: 1;
        }
        .library-card-info h4 {
            font-size: 16px;
            color: #2c3e50;
            margin-bottom: 4px;
        }
        .library-card-info p {
            font-size: 13px;
            color: #666;
            margin-bottom: 3px;
        }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🍄 สารานุกรม & วิเคราะห์เห็ด AI</h1>

    <div class="form-group">
        <label for="apiKey">Gemini API Key:</label>
        <input type="text" id="apiKey" placeholder="วาง API Key ของคุณที่นี่ (ระบบจะบันทึกให้อัตโนมัติ)">
    </div>

    <div class="form-group">
        <label for="imageInput">เลือกรูปภาพเห็ด:</label>
        <input type="file" id="imageInput" accept="image/*">
    </div>

    <div class="btn-group">
        <button type="button" class="btn-camera" id="startCamBtn" onclick="startCamera()">📷 เปิดกล้องถ่ายภาพ</button>
        <button type="button" class="btn-capture" id="captureBtn" onclick="capturePhoto()" style="display: none;">📸 ถ่ายรูป</button>
    </div>

    <video id="webcam" autoplay playsinline></video>
    <canvas id="canvas" style="display: none;"></canvas>
    <img id="preview" alt="ตัวอย่างรูปภาพ">

    <button id="analyzeBtn" onclick="analyzeMushroom()" style="margin-top: 15px;">วิเคราะห์เห็ด</button>

    <div id="result">
        <div class="result-title" id="resName"></div>
        <div class="result-item"><strong>ชื่อวิทยาศาสตร์:</strong> <span id="resSciName"></span></div>
        <div class="result-item"><strong>ระดับความปลอดภัย:</strong> <span id="resSafety"></span></div>
        <div class="result-item"><strong>ลักษณะสำคัญ:</strong> <span id="resFeatures"></span></div>
        <div class="result-item"><strong>เห็ดที่ลักษณะคล้ายกัน (อันตราย):</strong> <span id="resLookalike"></span></div>
        <div class="result-item"><strong>ข้อมูลโภชนาการ/การนำไปใช้:</strong> <span id="resUsage"></span></div>
        <button class="btn-save" id="saveBtn" onclick="saveToLibrary()">💾 บันทึกลงคลังเห็ด</button>
        <div class="disclaimer">* หมายเหตุ: ผลการวิเคราะห์จากระบบ AI เป็นเพียงข้อมูลเบื้องต้นเท่านั้น ห้ามนำเห็ดที่ไม่รู้จักมารับประทานโดยเด็ดขาด</div>
    </div>

    <div class="library-section">
        <h2>📚 คลังเห็ดที่บันทึกไว้</h2>
        <div class="library-grid" id="libraryList"></div>
    </div>
</div>

<script>
    const imageInput = document.getElementById('imageInput');
    const preview = document.getElementById('preview');
    const webcam = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const startCamBtn = document.getElementById('startCamBtn');
    const captureBtn = document.getElementById('captureBtn');
    const apiKeyInput = document.getElementById('apiKey');
    
    let base64Image = "";
    let mediaStream = null;
    let currentMushroomData = null;

    document.addEventListener('DOMContentLoaded', () => {
        const savedApiKey = localStorage.getItem('gemini_api_key');
        if (savedApiKey) {
            apiKeyInput.value = savedApiKey;
        }
        renderLibrary();
    });

    apiKeyInput.addEventListener('input', () => {
        localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
    });

    imageInput.addEventListener('change', function(e) {
        stopCamera();
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                preview.src = event.target.result;
                preview.style.display = 'block';
                base64Image = event.target.result.split(',')[1];
            };
            reader.readAsDataURL(file);
        }
    });

    async function startCamera() {
        try {
            preview.style.display = 'none';
            mediaStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment' },
                audio: false
            });
            webcam.srcObject = mediaStream;
            webcam.style.display = 'block';
            startCamBtn.style.display = 'none';
            captureBtn.style.display = 'block';
        } catch (err) {
            alert('ไม่สามารถเข้าถึงกล้องได้: ' + err.message);
        }
    }

    function capturePhoto() {
        if (!mediaStream) return;
        
        canvas.width = webcam.videoWidth;
        canvas.height = webcam.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(webcam, 0, 0, canvas.width, canvas.height);
        
        const dataUrl = canvas.toDataURL('image/jpeg');
        preview.src = dataUrl;
        preview.style.display = 'block';
        base64Image = dataUrl.split(',')[1];
        
        stopCamera();
    }

    function stopCamera() {
        if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
            mediaStream = null;
        }
        webcam.style.display = 'none';
        startCamBtn.style.display = 'block';
        captureBtn.style.display = 'none';
    }

    async function analyzeMushroom() {
        const apiKey = apiKeyInput.value.trim();
        const analyzeBtn = document.getElementById('analyzeBtn');
        const resultDiv = document.getElementById('result');

        if (!apiKey) {
            alert('กรุณากรอก Gemini API Key');
            return;
        }

        localStorage.setItem('gemini_api_key', apiKey);

        if (!base64Image) {
            alert('กรุณาเลือกรูปภาพหรือถ่ายรูปเห็ด');
            return;
        }

        analyzeBtn.disabled = true;
        analyzeBtn.innerText = 'กำลังวิเคราะห์ข้อมูล...';
        resultDiv.style.display = 'none';

        const modelName = "gemini-3.5-flash-lite";
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;

        const promptText = `วิเคราะห์ภาพเห็ดนี้แล้วตอบกลับเป็นรูปแบบ JSON ภาษาไทยเท่านั้น โดยใช้โครงสร้างตามนี้:
{
    "commonName": "ชื่อภาษาไทยหรือชื่อสามัญ",
    "scientificName": "ชื่อวิทยาศาสตร์",
    "safetyLevel": "กินได้" หรือ "ควรระวัง" หรือ "มีพิษอันตราย",
    "features": "อธิบายลักษณะสำคัญของเห็ด",
    "lookalikes": "เห็ดคู่แฝดที่อาจสับสนและอันตราย (ถ้ามี)",
    "usage": "ประโยชน์ การประกอบอาหาร หรือคำแนะนำในการหลีกเลี่ยง"
}`;

        const payload = {
            contents: [
                {
                    parts: [
                        { text: promptText },
                        {
                            inline_data: {
                                mime_type: "image/jpeg",
                                data: base64Image
                            }
                        }
                    ]
                }
            ],
            generationConfig: {
                response_mime_type: "application/json"
            }
        };

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (data.error) {
                alert('เกิดข้อผิดพลาดจาก API: ' + data.error.message);
            } else {
                const textResult = data.candidates[0].content.parts[0].text;
                const mushroomInfo = JSON.parse(textResult);

                currentMushroomData = {
                    ...mushroomInfo,
                    image: 'data:image/jpeg;base64,' + base64Image,
                    timestamp: new Date().toLocaleDateString('th-TH')
                };

                document.getElementById('resName').innerText = mushroomInfo.commonName || "ไม่ทราบชื่อ";
                document.getElementById('resSciName').innerText = mushroomInfo.scientificName || "-";
                document.getElementById('resSafety').innerText = mushroomInfo.safetyLevel || "-";
                document.getElementById('resFeatures').innerText = mushroomInfo.features || "-";
                document.getElementById('resLookalike').innerText = mushroomInfo.lookalikes || "-";
                document.getElementById('resUsage').innerText = mushroomInfo.usage || "-";

                resultDiv.className = '';
                if (mushroomInfo.safetyLevel && mushroomInfo.safetyLevel.includes('กินได้')) {
                    resultDiv.classList.add('safe');
                } else if (mushroomInfo.safetyLevel && mushroomInfo.safetyLevel.includes('ระวัง')) {
                    resultDiv.classList.add('caution');
                } else {
                    resultDiv.classList.add('toxic');
                }

                resultDiv.style.display = 'block';
            }
        } catch (error) {
            alert('เกิดข้อผิดพลาดในการวิเคราะห์: ' + error.message);
        } finally {
            analyzeBtn.disabled = false;
            analyzeBtn.innerText = 'วิเคราะห์เห็ด';
        }
    }

    function saveToLibrary() {
        if (!currentMushroomData) return;
        
        let library = JSON.parse(localStorage.getItem('mushroom_library') || '[]');
        library.unshift(currentMushroomData);
        localStorage.setItem('mushroom_library', JSON.stringify(library));
        
        alert('บันทึกลงคลังเห็ดเรียบร้อยแล้ว!');
        renderLibrary();
    }

    function deleteFromLibrary(index) {
        let library = JSON.parse(localStorage.getItem('mushroom_library') || '[]');
        library.splice(index, 1);
        localStorage.setItem('mushroom_library', JSON.stringify(library));
        renderLibrary();
    }

    function renderLibrary() {
        const libraryList = document.getElementById('libraryList');
        let library = JSON.parse(localStorage.getItem('mushroom_library') || '[]');

        if (library.length === 0) {
            libraryList.innerHTML = '<p style="text-align: center; color: #888;">ยังไม่มีรายการเห็ดที่บันทึกไว้</p>';
            return;
        }

        libraryList.innerHTML = library.map((item, index) => {
            let badgeClass = 'safe';
            if (item.safetyLevel && item.safetyLevel.includes('ระวัง')) badgeClass = 'caution';
            if (item.safetyLevel && (item.safetyLevel.includes('พิษ') || item.safetyLevel.includes('อันตราย'))) badgeClass = 'toxic';

            return `
                <div class="library-card">
                    <img src="${item.image}" alt="${item.commonName}">
                    <div class="library-card-info">
                        <h4>${item.commonName}</h4>
                        <p><em>${item.scientificName}</em></p>
                        <p><span class="badge ${badgeClass}">${item.safetyLevel}</span></p>
                        <p style="font-size: 11px; color: #999;">บันทึกเมื่อ: ${item.timestamp}</p>
                        <button class="btn-delete" onclick="deleteFromLibrary(${index})">🗑️ ลบ</button>
                    </div>
                </div>
            `;
        }).join('');
    }
</script>
</body>
</html>
